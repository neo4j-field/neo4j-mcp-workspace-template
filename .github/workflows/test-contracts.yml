name: Test suite

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Validate dependency setup behavior
        run: python -m unittest tests.unit.test_setup_dependencies tests.unit.test_setup_graphrag tests.unit.test_setup_env -v
      - name: Validate MCP and skill contracts
        run: >-
          python -m unittest
          tests.contracts.test_workflow_contracts
          tests.contracts.test_ci_release_gates -v
      - name: Validate synthetic extraction golden set and scorer
        run: python -m unittest tests.golden.test_evaluate -v
      - name: Validate runtime Desktop schemas and lexical behavior
        run: >-
          uv run --project mcp-neo4j-lexical-graph --extra docling python -m unittest
          tests.contracts.test_desktop_lexical_runtime_contract
          tests.unit.test_lexical_chunk_rebuild
          tests.unit.test_lexical_page_accounting
          tests.unit.test_lexical_parser_modes
          tests.unit.test_lexical_write_boundaries
          tests.unit.test_document_input_routing
          tests.unit.test_structured_document_parser
          tests.unit.test_pageless_lexical_flow
          tests.unit.test_docling_conversion_completion
          tests.unit.test_docling_native_hierarchy
          tests.unit.test_document_version_publication
          tests.unit.test_fulltext_index_failures
          tests.unit.test_vector_index_fallback
          tests.unit.test_embedding_identity -v
      - name: Validate reproducible all-format synthetic fixtures
        run: |
          uv run --no-project --python 3.12 --with reportlab==4.4.9 --with python-docx==1.2.0 --with Pillow==13.0.0 --with PyYAML==6.0.3 python -m unittest tests.synthetic.test_canonical tests.synthetic.test_renderers tests.synthetic.test_generate -v
          scripts/generate-synthetic-dataset.sh --profile smoke
          uv run --project mcp-neo4j-lexical-graph --extra docling python -m tests.synthetic.validate data/synthetic/smoke --parse
      - name: Validate safe ingest query compilation
        run: >-
          uv run --project mcp-neo4j-ingest python -m unittest
          tests.unit.test_ingest_query_compiler tests.unit.test_ingest_csv_nulls -v
      - name: Validate entity extraction coverage and relationship persistence
        run: >-
          uv run --project mcp-neo4j-entity-graph python -m unittest
          tests.unit.test_entity_extraction_coverage
          tests.unit.test_entity_relationship_persistence
          tests.synthetic.test_schemas
          tests.unit.test_setup_model_preflight
          tests.unit.test_gpt6_extraction_params
          tests.unit.test_bridge_normalization
          tests.unit.test_extraction_identity
          tests.unit.test_schema_preflight
          tests.unit.test_ontology_spec
          tests.golden.test_schema
          tests.golden.test_run_extraction -v
      - name: Validate report completion contracts
        run: >-
          uv run --project mcp-neo4j-proxy python -m unittest
          discover -s tests/report_validation -v

  neo4j-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_MCP_RUN_INTEGRATION: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
      OPENAI_API_KEY: ci-not-used
      EMBEDDING_MODEL: text-embedding-3-small
      EXTRACTION_MODEL: gpt-6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run structured-ingest integration
        run: >-
          uv run --project mcp-neo4j-ingest python -m unittest
          tests.integration.test_structured_ingest_mcp -v
      - name: Run lexical graph integrations
        run: >-
          uv run --project mcp-neo4j-lexical-graph --extra docling python -m unittest
          tests.integration.test_document_version_publication_mcp
          tests.integration.test_lexical_chunk_rebuild_mcp
          tests.integration.test_lexical_page_accounting_mcp
          tests.integration.test_docling_native_hierarchy_mcp
          tests.integration.test_lexical_navigation_metadata_mcp
          tests.integration.test_lexical_write_boundaries_mcp
          tests.integration.test_pageless_lexical_flow_mcp
          tests.integration.test_document_formats_mcp -v
      - name: Run entity and ontology integrations
        run: >-
          uv run --project mcp-neo4j-entity-graph python -m unittest
          tests.integration.test_entity_relationship_persistence_mcp
          tests.integration.test_entity_extraction_coverage_mcp
          tests.integration.test_extraction_completion_mcp
          tests.integration.test_schema_preflight_mcp
          tests.integration.test_owned_replacement_mcp
          tests.integration.test_ontology_workflow_mcp
          tests.integration.test_ontology_spec_mcp
          tests.integration.test_bridge_property_policy_mcp -v

  search-index-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.09.0-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      NEO4J_MCP_RUN_INTEGRATION: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Verify required search index failure and repair
        run: >-
          uv run --project mcp-neo4j-lexical-graph --extra docling python -m unittest
          tests.integration.test_fulltext_index_failures_mcp -v

      - name: Verify synthetic public ingestion truth and native nulls
        run: |
          scripts/generate-synthetic-dataset.sh --profile smoke
          uv run --project mcp-neo4j-ingest python -m tests.synthetic.check_ingest data/synthetic/smoke --disposable-database neo4j --report outputs/reports/synthetic-smoke-ingest.json

  desktop-smoke:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_MCP_RUN_DESKTOP_SMOKE: "1"
      NEO4J_MCP_DESKTOP_SMOKE_SKIP_EMBEDDING: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
      NEO4J_ONTOLOGY_DATABASE: neo4j
      OPENAI_API_KEY: ci-not-used
      EMBEDDING_MODEL: text-embedding-3-small
      EXTRACTION_MODEL: gpt-6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run exact-DXT headless ingestion smoke
        run: >-
          uv run --project mcp-neo4j-proxy python -m unittest
          tests.integration.test_desktop_lexical_smoke_mcp -v

  vector-fallback-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2025.12.1-enterprise
        env:
          NEO4J_AUTH: neo4j/test-password
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_MCP_RUN_VECTOR_FALLBACK: "1"
      NEO4J_MCP_RUN_EMBEDDING_IDENTITY: "1"
      NEO4J_MCP_RUN_EMBEDDING_PRIVILEGES: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
      OPENAI_API_KEY: ci-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Verify fallback on the originally affected Neo4j version
        run: >-
          uv run --project mcp-neo4j-lexical-graph python -m unittest
          tests.integration.test_vector_index_fallback_mcp
          tests.integration.test_embedding_identity_mcp
          tests.integration.test_embedding_privileges_mcp -v
