version: 1

contracts:
  chatbot_report:
    required_sections:
      - Source Data
      - Use Case
      - Graph Data Model
      - Target Questions and Answers
      - Gaps and Limitations
      - Recommended Next Steps
    conditional_sections:
      - section: Extraction Quality
        when: pdf_data_present
    repeated_record:
      source: confirmed_target_questions
      section: Target Questions and Answers
      heading_prefix: Q
      fields:
        - question
        - method
        - query
        - answer
        - quality
        - improvement
    evidence:
      - source_files_and_counts
      - graph_model
      - executed_query_per_question

  analytical_report:
    required_sections:
      - Source Data
      - Use Cases
      - Graph Data Model
      - Cypher Queries
      - Gaps and Limitations
      - Recommended Next Steps
    conditional_sections:
      - section: Extraction Quality
        when: pdf_data_present
    repeated_record:
      source: confirmed_use_cases
      section: Cypher Queries
      heading_prefix: Use case
      fields:
        - use_case
        - cypher
        - results
        - coverage
    evidence:
      - source_files_and_counts
      - graph_model
      - executed_query_per_use_case

  graph_quality_report:
    required_sections:
      - Baseline and Run Provenance
      - Quality Summary
      - Findings
      - Proposed Changes
      - Approved Changes
      - Before and After
      - Regressions and Remaining Issues
      - Recommended Next Round
    repeated_record:
      source: quality_findings
      section: Findings
      heading_prefix: Finding
      fields:
        - check
        - severity
        - confidence
        - affected_scope
        - evidence
        - proposed_change
        - expected_impact
        - validation_method
    evidence:
      - schema_and_extraction_version
      - query_or_sample_per_finding
      - comparable_before_after_metrics
